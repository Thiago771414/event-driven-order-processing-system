apiVersion: apps/v1
kind: Deployment
metadata:
  name: minishop-api
  labels:
    app: minishop-api
    app.kubernetes.io/name: minishop-api
    app.kubernetes.io/component: api
    release-track: stable
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: minishop-api
      release-track: stable
  template:
    metadata:
      labels:
        app: minishop-api
        app.kubernetes.io/name: minishop-api
        app.kubernetes.io/component: api
        app.kubernetes.io/version: v1
        release-track: stable
    spec:
      containers:
        - name: api
          image: minishop-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: API_PORT
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: API_PORT
            - name: APP_VERSION
              value: "v1"
            - name: DEPLOYMENT_VERSION
              value: "stable"
            - name: RELEASE_TRACK
              value: "stable"
            - name: CANARY_COHORT
              value: "control"
            - name: KAFKA_CLIENT_ID
              value: "minishop-api-v1"
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: POSTGRES_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: REDIS_URL
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: KAFKA_BROKER

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: "minishop-api"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version=$(APP_VERSION),deployment.version=$(DEPLOYMENT_VERSION),release.track=$(RELEASE_TRACK),canary.cohort=$(CANARY_COHORT)"
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: OTEL_METRICS_EXPORTER

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minishop-secrets
                  key: JWT_SECRET

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
