apiVersion: apps/v1
kind: Deployment
metadata:
  name: minishop-worker
  labels:
    app: minishop-worker
    app.kubernetes.io/name: minishop-worker
    app.kubernetes.io/component: worker
    release-track: stable
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minishop-worker
      release-track: stable
  template:
    metadata:
      labels:
        app: minishop-worker
        app.kubernetes.io/name: minishop-worker
        app.kubernetes.io/component: worker
        app.kubernetes.io/version: v1
        release-track: stable
    spec:
      containers:
        - name: worker
          image: minishop-worker:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: metrics
              containerPort: 9100
          env:
            - name: POSTGRES_URL
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: POSTGRES_URL
            - name: APP_VERSION
              value: "v1"
            - name: DEPLOYMENT_VERSION
              value: "stable"
            - name: RELEASE_TRACK
              value: "stable"
            - name: CANARY_COHORT
              value: "control"
            - name: KAFKA_CLIENT_ID
              value: "minishop-worker-v1"
            - name: KAFKA_CONSUMER_GROUP_ID
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: KAFKA_CONSUMER_GROUP_ID
            - name: KAFKA_FROM_BEGINNING
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: KAFKA_FROM_BEGINNING
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: KAFKA_BROKER
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: REDIS_URL

            # metrics
            - name: METRICS_PORT
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: WORKER_METRICS_PORT

            # otel
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: OTEL_EXPORTER_OTLP_ENDPOINT
            - name: OTEL_SERVICE_NAME
              value: "minishop-worker"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.version=$(APP_VERSION),deployment.version=$(DEPLOYMENT_VERSION),release.track=$(RELEASE_TRACK),canary.cohort=$(CANARY_COHORT)"
            - name: OTEL_TRACES_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: OTEL_TRACES_EXPORTER
            - name: OTEL_METRICS_EXPORTER
              valueFrom:
                configMapKeyRef:
                  name: minishop-config
                  key: OTEL_METRICS_EXPORTER

          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
